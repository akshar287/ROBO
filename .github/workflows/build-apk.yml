name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK and Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ./android-app/local.properties
          cat ./android-app/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android-app/gradlew

      - name: Build Debug APK
        id: build_apk
        working-directory: ./android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK files
        if: always()
        run: |
          echo "Searching for APK files..."
          find ./android-app -name "*.apk" -type f 2>/dev/null || echo "No APKs found"

      - name: Prepare APK Output
        run: |
          mkdir -p output-apk
          APK_PATH=$(find ./android-app/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find ./android-app -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          echo "APK path: $APK_PATH"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output-apk/ROBO-Agent.apk
            echo "APK copied successfully"
            ls -la output-apk/
          else
            echo "ERROR: No APK file found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-Agent-APK
          path: output-apk/ROBO-Agent.apk
          retention-days: 30

      - name: Create or Update Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "ROBO Mobile Agent v1.0.0 (Direct APK)"
          body: |
            ### 🤖 ROBO Android Agent - Direct APK Download

            Download `ROBO-Agent.apk` directly on your mobile device to test ROBO.

            **Features:**
            - 19-Screen UI/UX aligned with master specifications
            - Continuous background service
            - Multilingual voice support (Gujarati, Hindi, English)
            - WhatsApp and Calling support
            - Master ON/OFF sync with Laptop and Web Dashboard
          files: output-apk/ROBO-Agent.apk
