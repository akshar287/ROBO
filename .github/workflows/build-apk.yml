name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Diagnostic & Configure Android SDK
        run: |
          echo "=== DIAGNOSTICS ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          
          # Find sdkmanager
          SDKMANAGER=$(which sdkmanager || find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          
          if [ -n "$SDKMANAGER" ]; then
            yes | $SDKMANAGER --licenses || true
            $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" || true
          fi
          
          echo "sdk.dir=$ANDROID_HOME" > ./android-app/local.properties
          cat ./android-app/local.properties

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android-app/gradlew

      - name: Build Debug APK
        id: build_apk
        working-directory: ./android-app
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log || {
            echo "BUILD_FAILED=1" >> $GITHUB_ENV
            exit 1
          }

      - name: Report Build Results
        if: always()
        run: |
          echo "### Gradle Build Log (Last 150 Lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 150 gradle_build.log >> $GITHUB_STEP_SUMMARY || echo "No log found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Push build log to ci-log branch for immediate local inspection
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B ci-log
          cp gradle_build.log build_log.txt || true
          git add build_log.txt || true
          git commit -m "ci: update build log [skip ci]" || true
          git push -f origin ci-log || true

      - name: Find and Prepare APK
        if: steps.build_apk.outcome == 'success'
        run: |
          mkdir -p output-apk
          echo "Searching for generated APK files..."
          find ./android-app -name "*.apk" -type f
          
          APK_PATH=$(find ./android-app -name "*debug*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find ./android-app -name "*.apk" -type f | head -1)
          fi
          
          echo "Selected APK: $APK_PATH"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output-apk/ROBO-Agent.apk
            ls -lh output-apk/
          else
            echo "::error::No APK file found despite successful build!"
            exit 1
          fi

      - name: Upload APK Artifact
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-Agent-APK
          path: output-apk/ROBO-Agent.apk
          retention-days: 30

      - name: Publish Direct Download Release
        if: steps.build_apk.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "ROBO Mobile Agent v1.0.0 (Direct APK)"
          body: |
            ### 🤖 ROBO Android Agent - Direct APK Download

            Download `ROBO-Agent.apk` directly on your mobile device to test ROBO.

            **Features:**
            - 19-Screen UI/UX aligned with master specifications
            - Continuous background service
            - Multilingual voice support (Gujarati, Hindi, English)
            - WhatsApp and Calling support
            - Master ON/OFF sync with Laptop and Web Dashboard
          files: output-apk/ROBO-Agent.apk
