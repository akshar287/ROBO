name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android-app/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output-apk
          find . -name "*.apk" -exec cp {} output-apk/ROBO-Agent.apk \;
          ls -la output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-Agent-APK
          path: output-apk/ROBO-Agent.apk
          retention-days: 30

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "ROBO Mobile Agent v1.0.0 (Direct APK)"
          body: |
            ### 🤖 ROBO Android Agent - Direct APK Download
            Download `ROBO-Agent.apk` directly on your mobile phone to install and test ROBO.
            
            **Features:**
            - Continuous background service (Foreground Service with sticky notification)
            - Multilingual voice support (Gujarati, Hindi, English)
            - Zero-token WhatsApp and Calling support
            - Automatic sync with Laptop Agent and Web Dashboard
          files: output-apk/ROBO-Agent.apk
