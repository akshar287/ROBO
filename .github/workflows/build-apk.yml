name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK and Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ./android-app/local.properties
          cat ./android-app/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android-app/gradlew

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
        continue-on-error: true
        id: build

      - name: Report Errors If Any
        if: steps.build.outcome == 'failure'
        run: |
          echo "## Build Errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(e: |FAILURE:|Error:)" ./android-app/build.log >> $GITHUB_STEP_SUMMARY || cat ./android-app/build.log | tail -n 80 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== BUILD LOG ==="
          cat ./android-app/build.log | tail -n 80
          exit 1

      - name: Prepare APK Output
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p output-apk
          find ./android-app -name "*.apk" -exec cp {} output-apk/ROBO-Agent.apk \;
          ls -la output-apk/

      - name: Upload APK Artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-Agent-APK
          path: output-apk/ROBO-Agent.apk
          retention-days: 30

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "ROBO Mobile Agent v1.0.0 (Direct APK)"
          body: |
            ### 🤖 ROBO Android Agent - Direct APK Download
            Download `ROBO-Agent.apk` directly on your mobile device to test ROBO.
            
            **Features:**
            - Continuous background service
            - Multilingual voice support (Gujarati, Hindi, English)
            - Zero-token WhatsApp and Calling support
            - Master ON/OFF sync with Laptop and Web Dashboard
          files: output-apk/ROBO-Agent.apk
